const f$=n=>Number(n||0).toLocaleString()+'₮';
function calc(items){const s=items.reduce((a,i)=>a+i.q*i.up,0);const v=Math.round(s*.1);return{sub:s,vat:v,total:s+v}}
function paidAmt(o){return Number(o.paid ?? (o.ps==='paid'?calc(o.items).total:0))}
function payState(o){const total=calc(o.items).total;const paid=Math.min(total,paidAmt(o));return paid>=total?'paid':paid>0?'partial':'pending'}
const genId=()=>{const n=new Date();const mm=String(n.getMonth()+1).padStart(2,'0');const dd=String(n.getDate()).padStart(2,'0');return`Z-${String(n.getFullYear()).slice(2)}${mm}${dd}-${String(Math.floor(Math.random()*900)+100)}`};
const today=()=>{const n=new Date();const mm=String(n.getMonth()+1).padStart(2,'0');const dd=String(n.getDate()).padStart(2,'0');const HH=String(n.getHours()).padStart(2,'0');const MM=String(n.getMinutes()).padStart(2,'0');const SS=String(n.getSeconds()).padStart(2,'0');return{d:`${n.getFullYear()}.${mm}.${dd}`,t:`${HH}:${MM}:${SS}`}};
function dlCSV(rows,fn){const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url)}

function Badge({s,t='o'}){const d=t==='o'?ST[s]:PS[s];if(!d)return null;return <span style={{background:d.bg,color:d.tc,fontSize:11,padding:'2px 10px',borderRadius:99,fontWeight:600,whiteSpace:'nowrap',display:'inline-block'}}>{d.l}</span>}
function Avatar({user,size=42}){const initials=(user?.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();return <div style={{width:size,height:size,borderRadius:size/2,background:'linear-gradient(135deg,#dbeafe,#ede9fe)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0,border:'2px solid rgba(255,255,255,.75)',boxShadow:'0 4px 14px rgba(15,23,42,.12)'}}>{user?.photo?<img src={user.photo} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span style={{fontSize:Math.max(11,Math.round(size*.34)),fontWeight:900,color:B}}>{initials}</span>}</div>}
function Hdr({title,sub,back,right}){return(<div className="no-print" style={{background:B,padding:'14px 16px 18px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={{display:'flex',gap:10,alignItems:'center'}}>{back&&<button onClick={back} style={{background:'rgba(255,255,255,.2)',border:'none',color:W,cursor:'pointer',width:32,height:32,borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-arrow-left" style={{fontSize:18}}/></button>}<div><div style={{fontSize:17,fontWeight:700,color:W}}>{title}</div>{sub&&<div style={{fontSize:11,opacity:.75,marginTop:1,color:W}}>{sub}</div>}</div></div>{right||null}</div></div>)}

function Nav({tab,set,onNew}){const tabs=[{k:'home',ic:'ti-home',l:'Нүүр'},{k:'reports',ic:'ti-chart-bar',l:'Тайлан'},{k:'_'},{k:'orders',ic:'ti-list',l:'Захиалга'},{k:'more',ic:'ti-grid-dots',l:'Бусад'}];return(<div className="no-print" style={{position:'fixed',left:'50%',bottom:'max(10px, env(safe-area-inset-bottom))',transform:'translateX(-50%)',width:'100%',maxWidth:430,zIndex:70,background:W,borderTop:`0.5px solid ${BD}`,display:'flex',padding:'5px 0 10px',boxShadow:'0 -4px 16px rgba(0,0,0,.08)'}}>{tabs.map(it=>{if(it.k==='_')return(<div key="_" style={{flex:1,display:'flex',justifyContent:'center'}}><button onClick={onNew} style={{width:54,height:54,borderRadius:27,background:B,border:`4px solid ${BG}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginTop:-18,boxShadow:'0 4px 16px rgba(35,82,220,.45)'}}><i className="ti ti-plus" style={{fontSize:26,color:W}}/></button></div>);const a=tab===it.k;return(<button key={it.k} onClick={()=>set(it.k)} style={{flex:1,border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'7px 0 0',color:a?B:MU}}><i className={`ti ${it.ic}`} style={{fontSize:22}}/><span style={{fontSize:10,fontWeight:a?700:400}}>{it.l}</span></button>);})}</div>)}
function Btn({children,color=B,onClick,outline,small,disabled}){const bg=outline?W:disabled?'#d1d5db':color;const bc=outline?color:bg;return <button onClick={onClick} disabled={disabled} style={{background:bg,color:outline?color:W,border:`1.5px solid ${bc}`,borderRadius:small?7:11,padding:small?'6px 12px':'12px 8px',fontSize:small?12:13,fontWeight:600,cursor:disabled?'default':'pointer',flex:1,minWidth:80}}>{children}</button>}
function Input({label,value,onChange,type='text',placeholder=''}){return <div><div style={{fontSize:10,color:MU,marginBottom:3}}>{label}</div><input className="input-sm" type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}/></div>}
function Sel({label,value,onChange,options}){return <div><div style={{fontSize:10,color:MU,marginBottom:3}}>{label}</div><select className="input-sm" value={value} onChange={e=>onChange(e.target.value)}>{options.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}</select></div>}
function getSupabaseClient(){const cfg=window.SUPABASE_CONFIG||{};const maker=window.supabase?.createClient||window.supabaseJs?.createClient;if(!cfg.url||!cfg.anonKey||!maker)return null;return maker(cfg.url,cfg.anonKey)}
const requireSupabaseAuth=()=>window.SUPABASE_CONFIG?.requireAuth===true;


function InstallPrompt(){const[deferred,setDeferred]=useState(null);const[show,setShow]=useState(false);const[ios,setIos]=useState(false);const[dismissed,setDismissed]=useState(()=>localStorage.getItem('install-dismissed')==='1');
useEffect(()=>{const standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone;if(standalone||dismissed)return;const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);setIos(isIos);const ready=event=>{event.preventDefault();setDeferred(event);setShow(true)};window.addEventListener('beforeinstallprompt',ready);if(isIos)setShow(true);return()=>window.removeEventListener('beforeinstallprompt',ready)},[dismissed]);
const close=()=>{localStorage.setItem('install-dismissed','1');setDismissed(true);setShow(false)};
const install=async()=>{if(!deferred){setIos(true);setShow(true);return}deferred.prompt();await deferred.userChoice;setDeferred(null);setShow(false)};
if(!show||dismissed)return null;
return <div className="no-print" style={{position:'fixed',left:'50%',bottom:88,transform:'translateX(-50%)',width:'calc(100% - 24px)',maxWidth:406,zIndex:120,background:W,border:'0.5px solid '+BD,borderRadius:14,boxShadow:'0 18px 50px rgba(15,23,42,.2)',padding:12}}><div style={{display:'flex',gap:10,alignItems:'center'}}><div style={{width:38,height:38,borderRadius:12,background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center',color:B,flexShrink:0}}><i className="ti ti-device-mobile-down" style={{fontSize:20}}/></div><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:900,color:TX}}>App суулгах</div><div style={{fontSize:11,color:MU,marginTop:2,lineHeight:1.35}}>{ios?'Safari дээр Share -> Add to Home Screen дарна.':'Home screen дээр icon болгож нэмнэ.'}</div></div><button onClick={close} style={{border:'none',background:'none',color:MU,cursor:'pointer',padding:4}}><i className="ti ti-x" style={{fontSize:18}}/></button></div>{!ios&&<button onClick={install} style={{width:'100%',marginTop:10,border:'none',background:B,color:W,borderRadius:10,padding:'10px 12px',fontSize:13,fontWeight:900,cursor:'pointer'}}>Суулгах</button>}</div>}

function LoginScreen({users,onLogin}){const[em,setEm]=useState('bat@example.com');const[pw,setPw]=useState('Admin123!');const[err,setErr]=useState('');const[show,setShow]=useState(false);const[busy,setBusy]=useState(false);
const doLogin=async()=>{if(!em||!pw){setErr('Имэйл болон нууц үг оруулна уу');return}const email=em.trim();const u=users.map(normalizeUser).find(x=>x.email.toLowerCase()===email.toLowerCase());if(u&&u.active===false){setErr('Энэ хэрэглэгч идэвхгүй байна');return}const sb=getSupabaseClient();if(sb){setBusy(true);const{error}=await sb.auth.signInWithPassword({email,password:pw});setBusy(false);if(error&&requireSupabaseAuth()){setErr('Имэйл эсвэл нууц үг буруу байна.');return}if(!error){if(u){onLogin(u);return}setErr('Энэ имэйлээр app-д нэвтрэх эрх олдсонгүй.');return}}if(requireSupabaseAuth()){setErr('Нэвтрэх холболт түр ажиллахгүй байна. Дахин оролдоно уу.');return}if(u&&pw===u.passcode){onLogin(u)}else{setErr('Имэйл эсвэл нууц үг буруу байна.')}};return(<div style={{minHeight:'100vh',background:B,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}><div style={{width:'100%',maxWidth:360}}><div style={{textAlign:'center',marginBottom:28}}><div style={{width:64,height:64,borderRadius:18,background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><i className="ti ti-building-store" style={{fontSize:32,color:W}}/></div><div style={{fontSize:22,fontWeight:700,color:W}}>Захиалгын систем</div><div style={{fontSize:12,color:'rgba(255,255,255,.7)',marginTop:4}}>B2B Sales Order Management</div></div>
<Card><div style={{fontSize:16,fontWeight:700,color:TX,marginBottom:16}}>Нэвтрэх</div><div style={{display:'flex',flexDirection:'column',gap:10}}>
<Input label="Имэйл" value={em} onChange={setEm} type="email"/>
<div><div style={{fontSize:10,color:MU,marginBottom:3}}>Нууц үг</div><div style={{position:'relative'}}><input className="input-sm" type={show?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}/><button onClick={()=>setShow(s=>!s)} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:MU,padding:2}}><i className={`ti ${show?'ti-eye-off':'ti-eye'}`} style={{fontSize:14}}/></button></div></div>
{err&&<div style={{color:'#dc2626',fontSize:12}}>{err}</div>}
<button onClick={doLogin} style={{background:B,color:W,border:'none',borderRadius:11,padding:14,fontSize:15,fontWeight:700,cursor:'pointer',width:'100%',marginTop:4}}>Нэвтрэх</button>
<div style={{fontSize:11,color:MU,textAlign:'center'}}>bat@example.com · sarnai@example.com · admin@example.com / Admin123!</div>
</div></Card></div></div>)}

function HomeScreen({orders,custs,users,user,onDetail,onViewAll}){
const[showNotifications,setShowNotifications]=useState(false);const[showCustomers,setShowCustomers]=useState(false);const[homeSp,setHomeSp]=useState('all');
const salespersonScope=userSalesperson(user);const salespeople=useMemo(()=>['all',...new Set([...(users||[]).map(normalizeUser).filter(u=>u.role==='salesperson').map(userSalesperson),...orders.map(o=>o.sp)].filter(Boolean))],[orders,users]);
const scopedOrders=useMemo(()=>salespersonScope?orders.filter(o=>o.sp===salespersonScope):(homeSp==='all'?orders:orders.filter(o=>o.sp===homeSp)),[orders,salespersonScope,homeSp]);

function ReportsScreen({orders,custs,user}){const salespersonScope=userSalesperson(user);const[sp,setSp]=useState(salespersonScope||'all');const[startDate,setStartDate]=useState('2026-05-01');const[endDate,setEndDate]=useState('2026-05-31');const[showAll,setShowAll]=useState(false);const[showAllProducts,setShowAllProducts]=useState(false);const[selectedMonth,setSelectedMonth]=useState(null);

const activeFilt=filt.filter(o=>o.status!=='cancelled');const tot=activeFilt.reduce((a,o)=>a+calc(o.items).total,0);const paid=activeFilt.reduce((a,o)=>a+paidAmt(o),0);const unpaid=tot-paid;

const totalSoldQty=productStats.reduce((a,p)=>a+p.qty,0);const totalProductSales=productStats.reduce((a,p)=>a+p.total,0);
const visibleProductStats=showAllProducts?productStats:productStats.slice(0,3);
const monthReports=useMemo(()=>{const m=new Map();allowedOrders.filter(o=>o.status!=='cancelled').forEach(o=>{const key=orderMonth(o);const cur=m.get(key)||{month:key,count:0,total:0,paid:0,unpaid:0};const total=calc(o.items).total;const p=paidAmt(o);cur.count+=1;cur.total+=total;cur.paid+=p;cur.unpaid+=Math.max(0,total-p);m.set(key,cur)});return[...m.values()].sort((a,b)=>b.month.localeCompare(a.month))},[allowedOrders]);

const monthPaidPct=monthDetail&&monthDetail.total?Math.min(100,Math.round(monthDetail.paid/monthDetail.total*100)):0;const monthUnpaidPct=monthDetail&&monthDetail.total?Math.min(100-monthPaidPct,Math.round(monthDetail.unpaid/monthDetail.total*100)):0;
const monthProductStats=useMemo(()=>{const m=new Map();monthOrders.forEach(o=>(o.items||[]).forEach(i=>{const key=i.pid||i.sku||i.name;const cur=m.get(key)||{pid:i.pid,sku:i.sku||'',name:i.name||'Бараа',qty:0,total:0,orders:new Set()};cur.qty+=Number(i.q)||0;cur.total+=(Number(i.q)||0)*(Number(i.up)||0);cur.orders.add(o.id);m.set(key,cur)}));return[...m.values()].map(x=>({...x,orderCount:x.orders.size})).sort((a,b)=>b.qty-a.qty||b.total-a.total)},[monthOrders]);

function ProfileScreen({user,onSave,back}){const[f,setF]=useState({name:user?.name||'',phone:user?.phone||'',photo:user?.photo||''});const[crop,setCrop]=useState({x:50,y:50,z:1});const[drag,setDrag]=useState(null);const[saved,setSaved]=useState(false);
const loadFile=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{setF(x=>({...x,photo:ev.target.result}));setCrop({x:50,y:50,z:1})};r.readAsDataURL(file)};
const startDrag=e=>{e.preventDefault();e.currentTarget.setPointerCapture?.(e.pointerId);setDrag({sx:e.clientX,sy:e.clientY,x:crop.x,y:crop.y})};
const moveDrag=e=>{if(!drag)return;const scale=55/crop.z;const nx=Math.max(0,Math.min(100,drag.x-(e.clientX-drag.sx)/scale));const ny=Math.max(0,Math.min(100,drag.y-(e.clientY-drag.sy)/scale));setCrop(c=>({...c,x:nx,y:ny}))};
const stopDrag=()=>setDrag(null);
const cropPhoto=()=>new Promise(resolve=>{if(!f.photo||!String(f.photo).startsWith('data:image'))return resolve(f.photo);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=320;c.height=320;const ctx=c.getContext('2d');const side=Math.min(img.width,img.height)/crop.z;const maxX=img.width-side,maxY=img.height-side;const sx=Math.max(0,Math.min(maxX,img.width*(crop.x/100)-side/2));const sy=Math.max(0,Math.min(maxY,img.height*(crop.y/100)-side/2));ctx.drawImage(img,sx,sy,side,side,0,0,320,320);resolve(c.toDataURL('image/jpeg',.9))};img.onerror=()=>resolve(f.photo);img.src=f.photo});
const save=async()=>{if(!f.name.trim())return;const photo=await cropPhoto();onSave({...user,name:f.name.trim(),phone:f.phone.trim(),photo});setF(x=>({...x,photo}));setSaved(true);setTimeout(()=>setSaved(false),1800)};
return(<div><Hdr title="Миний мэдээлэл" sub="Нэр, утас, profile зураг" back={back} right={<button onClick={save} style={{background:'rgba(255,255,255,.18)',color:W,border:'none',borderRadius:8,padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:500}}>{saved?'✓ Хадгалсан':'Хадгалах'}</button>}/>
<div style={{padding:'12px 12px',display:'flex',flexDirection:'column',gap:10}}>
<Card><div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}><Avatar user={{...user,...f}} size={64}/><div><div style={{fontSize:15,fontWeight:800,color:TX}}>{f.name||user.name}</div><div style={{fontSize:12,color:MU,marginTop:2}}>{roleLabel(user.role)} · {user.email}</div></div></div><div style={{display:'flex',flexDirection:'column',gap:9}}><Input label="Нэр *" value={f.name} onChange={v=>setF(x=>({...x,name:v}))}/><Input label="Утас" value={f.phone} onChange={v=>setF(x=>({...x,phone:v}))}/><div><div style={{fontSize:10,color:MU,marginBottom:5}}>Profile зураг</div><label style={{display:'flex',alignItems:'center',justifyContent:'center',gap:7,border:'1px dashed '+B,background:'#eff6ff',color:B,borderRadius:10,padding:'11px 12px',fontSize:13,fontWeight:800,cursor:'pointer'}}><i className="ti ti-upload" style={{fontSize:17}}/> Зураг upload хийх<input type="file" accept="image/*" onChange={loadFile} style={{display:'none'}}/></label></div>{f.photo&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,background:'#f8fafc',border:'0.5px solid '+BD,borderRadius:12,padding:12}}><div onPointerDown={startDrag} onPointerMove={moveDrag} onPointerUp={stopDrag} onPointerCancel={stopDrag} onLostPointerCapture={stopDrag} style={{width:184,height:184,borderRadius:92,overflow:'hidden',background:'#e5e7eb',position:'relative',boxShadow:'inset 0 0 0 2px #fff, 0 8px 24px rgba(15,23,42,.12)',cursor:drag?'grabbing':'grab',touchAction:'none',userSelect:'none'}}><img draggable={false} src={f.photo} alt="" style={{width:(crop.z*100)+'%',height:(crop.z*100)+'%',objectFit:'cover',objectPosition:crop.x+'% '+crop.y+'%',pointerEvents:'none'}}/><div style={{position:'absolute',left:0,right:0,bottom:0,background:'linear-gradient(transparent,rgba(15,23,42,.55))',color:W,fontSize:10,fontWeight:800,textAlign:'center',padding:'18px 6px 7px'}}>Зургаа чирээд тааруулна</div></div><div style={{width:'100%',display:'flex',flexDirection:'column',gap:7}}><div><div style={{fontSize:10,color:MU,marginBottom:3}}>Ойртуулах</div><input type="range" min="1" max="2.5" step=".05" value={crop.z} onChange={e=>setCrop(c=>({...c,z:Number(e.target.value)}))} style={{width:'100%'}}/></div></div><button onClick={()=>setF(x=>({...x,photo:''}))} style={{border:'none',background:'none',color:'#dc2626',fontSize:12,fontWeight:700,cursor:'pointer'}}>Зураг устгах</button></div>}</div></Card>
<button onClick={save} style={{background:B,color:W,border:'none',borderRadius:13,padding:14,fontSize:15,fontWeight:700,cursor:'pointer',width:'100%'}}>{saved?'✓ Мэдээлэл хадгалагдлаа':'Мэдээлэл хадгалах'}</button>
</div><div style={{height:16}}/></div>)}

return(<div><Hdr title="Компаний мэдээлэл" back={back} right={<button onClick={save} style={{background:'rgba(255,255,255,.18)',color:W,border:'none',borderRadius:8,padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:500}}>{saved?'✓ Хадгалагдлаа':'Хадгалах'}</button>}/>
<div style={{padding:'12px 12px',display:'flex',flexDirection:'column',gap:10}}>
<Card><div style={{fontSize:13,fontWeight:600,color:TX,marginBottom:10}}>Үндсэн мэдээлэл</div><div style={{display:'flex',flexDirection:'column',gap:10}}><Input label="Компаний нэр" value={f.name} onChange={v=>setF(x=>({...x,name:v}))}/><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><Input label="Регистрийн дугаар" value={f.reg} onChange={v=>setF(x=>({...x,reg:v}))}/><Input label="Утас" value={f.phone} onChange={v=>setF(x=>({...x,phone:v}))}/></div><Input label="Хаяг" value={f.addr} onChange={v=>setF(x=>({...x,addr:v}))}/><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><Sel label="Цагийн бүс" value={f.tz} onChange={v=>setF(x=>({...x,tz:v}))} options={['Asia/Ulaanbaatar','Asia/Shanghai','Europe/London']}/><Sel label="Валют" value={f.currency} onChange={v=>setF(x=>({...x,currency:v}))} options={['MNT','USD','CNY']}/></div></div></Card>
<button onClick={save} style={{background:B,color:W,border:'none',borderRadius:13,padding:14,fontSize:15,fontWeight:700,cursor:'pointer',width:'100%'}}>{saved?'✓ Хадгалагдлаа!':'Мэдээлэл хадгалах'}</button>
</div><div style={{height:16}}/></div>)}

function SecurityScreen({back}){const[f,setF]=useState({cur:'',nw:'',cf:''});const[msg,setMsg]=useState('');
const save=()=>{if(!f.cur||!f.nw||!f.cf){setMsg('Бүх талбарыг бөглөнө уу');return}if(f.nw!==f.cf){setMsg('Шинэ нууц үг таарахгүй байна');return}setMsg('✓ Нууц үг амжилттай солигдлоо');setF({cur:'',nw:'',cf:''})};
return(<div><Hdr title="Аюулгүй байдал" back={back}/>
<div style={{padding:'12px 12px',display:'flex',flexDirection:'column',gap:10}}>
<Card><div style={{fontSize:13,fontWeight:600,color:TX,marginBottom:10}}>Нууц үг солих</div><div style={{display:'flex',flexDirection:'column',gap:8}}><Input label="Одоогийн нууц үг" value={f.cur} onChange={v=>setF(x=>({...x,cur:v}))}/><Input label="Шинэ нууц үг" value={f.nw} onChange={v=>setF(x=>({...x,nw:v}))}/><Input label="Шинэ нууц үг давтах" value={f.cf} onChange={v=>setF(x=>({...x,cf:v}))}/>{msg&&<div style={{color:msg.startsWith('✓')?'#15803d':'#dc2626',fontSize:12,fontWeight:500}}>{msg}</div>}<Btn color={B} onClick={save}>Нууц үг солих</Btn></div></Card>
</div><div style={{height:16}}/></div>)}

function BackupScreen({back}){const[loading,setLoading]=useState(false);const[done,setDone]=useState(false);const doBackup=()=>{setLoading(true);setTimeout(()=>{setLoading(false);setDone(true)},1500)};
return(<div><Hdr title="Өгөгдлийн нөөцлөлт" back={back}/>
<div style={{padding:'12px 12px',display:'flex',flexDirection:'column',gap:10}}>
<Card><div style={{fontSize:13,fontWeight:600,color:TX,marginBottom:6}}>Сүүлийн нөөцлөлт</div><div style={{fontSize:12,color:'#15803d',marginBottom:12}}>✓ 2026.05.21 03:00 — амжилттай</div><button onClick={doBackup} disabled={loading} style={{background:loading?'#d1d5db':B,color:W,border:'none',borderRadius:11,padding:'12px',fontSize:13,fontWeight:600,cursor:loading?'default':'pointer',width:'100%'}}>{loading?'Нөөцлөж байна...':done?'✓ Нөөцлөлт амжилттай':'Одоо нөөцлөх'}</button></Card>
</div><div style={{height:16}}/></div>)}

function TaxScreen({back}){return(<div><Hdr title="Татвар, хөнгөлөлт" back={back}/><div style={{padding:'12px 12px'}}><Card><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div style={{fontSize:13,fontWeight:600}}>НӨАТ хувь</div><div style={{fontSize:11,color:MU}}>Нэмэгдсэн өртгийн татвар</div></div><div style={{background:'#eff6ff',color:B,padding:'4px 14px',borderRadius:99,fontWeight:700,fontSize:18}}>10%</div></div></Card></div></div>)}

function App(){
const[user,setUser]=useState(null);const loggedIn=!!user;const[tab,setTab]=useState('home');
const[orders,setOrders]=useState(INIT_ORDERS);const[products,setProducts]=useState(INIT_PRODS);const[custs,setCusts]=useState(INIT_CUSTS);const[categories,setCategories]=useState(CATS);
const[users,setUsers]=useState(INIT_USERS);
const[view,setView]=useState(null);const[toast,setToast]=useState(null);const[pull,setPull]=useState({start:null,y:0,refreshing:false});
const[dbReady,setDbReady]=useState(false);const clientId=useRef(Math.random().toString(36).slice(2));const applyingRemote=useRef(false);const saveTimer=useRef(null);
const scopeSp=userSalesperson(user);const visibleOrders=scopeSp?orders.filter(o=>o.sp===scopeSp):orders;
const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500)};
const applyData=data=>{const nextUsers=(data.users||INIT_USERS).map(normalizeUser);applyingRemote.current=true;setOrders(data.orders||INIT_ORDERS);setProducts(data.products||INIT_PRODS);setCusts(data.custs||INIT_CUSTS);setCategories(Array.isArray(data.categories)?data.categories:CATS);setUsers(nextUsers);setUser(u=>u?nextUsers.find(x=>x.id===u.id)||u:u);setView(v=>v&&v.o&&data.orders?{...v,o:data.orders.find(o=>o.id===v.o.id)||v.o}:v);setTimeout(()=>{applyingRemote.current=false},0)};
const serializeUsers=()=>users.map(u=>{const clean={...u};if(requireSupabaseAuth())delete clean.passcode;return clean});
const getData=()=>({orders,products,custs,categories,users:serializeUsers()});
const getSupabase=getSupabaseClient;
const saveDataNow=data=>{const sb=getSupabase();if(sb)return sb.from('app_state').upsert({id:'main',data,updated_at:new Date().toISOString()});return fetch('/api/db',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:clientId.current,data})})};
const refreshData=async()=>{if(pull.refreshing)return;setPull({start:null,y:56,refreshing:true});try{const sb=getSupabase();if(sb){const{data}=await sb.from('app_state').select('data').eq('id','main').maybeSingle();if(data?.data)applyData(data.data)}else{const r=await fetch('/api/db?ts='+Date.now());const data=await r.json();if(data&&!data.empty)applyData(data)}showToast('✓ Дата шинэчлэгдлээ')}catch(_){showToast('Дата шинэчлэхэд алдаа гарлаа')}finally{setTimeout(()=>setPull({start:null,y:0,refreshing:false}),320)}};
const atTop=()=>((window.scrollY||document.documentElement.scrollTop||0)<=0);
const touchStart=e=>{if(!loggedIn||pull.refreshing)return;if(atTop())setPull(p=>({...p,start:e.touches[0].clientY,y:0}))};
const touchMove=e=>{if(pull.start==null||pull.refreshing)return;const dy=e.touches[0].clientY-pull.start;if(dy>0&&atTop()){if(dy>18)e.preventDefault?.();setPull(p=>({...p,y:Math.min(86,dy*.55)}))}else if(dy<0)setPull({start:null,y:0,refreshing:false})};
const touchEnd=()=>{if(pull.refreshing)return;const y=pull.y;if(y>=52)refreshData();else setPull({start:null,y:0,refreshing:false})};
useEffect(()=>{let alive=true;const sb=getSupabase();if(sb){(async()=>{const{data,error}=await sb.from('app_state').select('data').eq('id','main').maybeSingle();if(!alive)return;if(data?.data)applyData(data.data);else await sb.from('app_state').upsert({id:'main',data:getData(),updated_at:new Date().toISOString()});setDbReady(true)})();const ch=sb.channel('order-app-state').on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'id=eq.main'},payload=>{const next=payload.new?.data;if(next)applyData(next)}).subscribe();return()=>{alive=false;sb.removeChannel(ch)}}fetch('/api/db').then(r=>r.json()).then(data=>{if(!alive)return;if(data&&!data.empty)applyData(data);setDbReady(true)}).catch(()=>setDbReady(true));const es=new EventSource('/api/events');es.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.source===clientId.current)return;applyData(msg.data||{})}catch(_){}};es.onerror=()=>{};return()=>{alive=false;es.close()}},[]);
useEffect(()=>{if(!loggedIn||!requireSupabaseAuth())return;let alive=true;const sb=getSupabase();if(!sb)return;(async()=>{const{data}=await sb.from('app_state').select('data').eq('id','main').maybeSingle();if(!alive)return;if(data?.data)applyData(data.data);setDbReady(true)})();return()=>{alive=false}},[loggedIn]);
useEffect(()=>{if(!dbReady||applyingRemote.current)return;clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>saveDataNow(getData()).catch?.(()=>{}),250);return()=>clearTimeout(saveTimer.current)},[dbReady,orders,products,custs,categories,users]);
const addOrder=o=>{setOrders(p=>[o,...p]);setView(null);setTab('orders');showToast('✓ Захиалга амжилттай үүслээ!')};
const updateOrder=o=>{setOrders(p=>p.map(x=>x.id===o.id?o:x));setView(null);showToast('✓ Захиалга шинэчлэгдлээ!')};
const updStatus=(id,status,cancelReason='')=>{setOrders(p=>p.map(o=>o.id===id?{...o,status,cancelReason:status==='cancelled'?cancelReason:o.cancelReason}:o));setView(v=>v&&v.type==='detail'&&v.o.id===id?{...v,o:{...v.o,status,cancelReason:status==='cancelled'?cancelReason:v.o.cancelReason}}:v)};
const updPayment=(id,amount)=>{setOrders(p=>p.map(o=>{if(o.id!==id)return o;const total=calc(o.items).total;const paid=Math.max(0,Math.min(total,paidAmt(o)+(Number(amount)||0)));return{...o,paid,ps:paid>=total?'paid':'pending'}}));setView(v=>v&&v.type==='detail'&&v.o.id===id?(()=>{const total=calc(v.o.items).total;const paid=Math.max(0,Math.min(total,paidAmt(v.o)+(Number(amount)||0)));return{...v,o:{...v.o,paid,ps:paid>=total?'paid':'pending'}}})():v);showToast('✓ Төлбөр шинэчлэгдлээ')};
const copyOrder=o=>{const{d,t}=today();const newO={...o,id:genId(),status:'new',ps:'pending',paid:0,d,t};setOrders(p=>[newO,...p]);setView({type:'detail',o:newO});showToast('✓ Захиалга хуулагдлаа!')};
const saveProfile=u=>{setUsers(p=>p.map(x=>x.id===u.id?u:x));setUser(u);showToast('✓ Миний мэдээлэл шинэчлэгдлээ')};
const updateCategories=updater=>setCategories(prev=>{const base=Array.isArray(prev)?prev:CATS;const next=typeof updater==='function'?updater(base):updater;clearTimeout(saveTimer.current);setTimeout(()=>saveDataNow({...getData(),categories:next}).catch?.(()=>showToast('Ангилал хадгалахад алдаа гарлаа')),0);return next});
const navFns={profile:()=>setView({type:'profile'}),products:()=>isAdmin(user)?setView({type:'products'}):showToast('Барааны тохиргоо зөвхөн Admin эрхтэй.'),customers:()=>setView({type:'customers'}),categories:()=>isAdmin(user)?setView({type:'categories'}):showToast('Ангилал өөрчлөх эрх зөвхөн Admin-д байна.'),users:()=>setView({type:'users'}),invoices:()=>setView({type:'invoices'}),company:()=>canManageSettings(user)?setView({type:'company'}):showToast('Компанийн мэдээлэл өөрчлөх эрхгүй.'),tax:()=>canManageSettings(user)?setView({type:'tax'}):showToast('Татварын тохиргоо өөрчлөх эрхгүй.'),security:()=>setView({type:'security'}),backup:()=>canManageSettings(user)?setView({type:'backup'}):showToast('Нөөцлөлт хийх эрхгүй.')};
const back=()=>setView(null);const vt=view?.type;
const W2={maxWidth:430,margin:'0 auto',background:BG,fontFamily:"-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif",minHeight:'100vh'};
if(!loggedIn)return <div style={W2}><LoginScreen users={users} onLogin={setUser}/><InstallPrompt/></div>;
return(<div style={{...W2,position:'relative'}} onTouchStart={touchStart} onTouchMove={touchMove} onTouchEnd={touchEnd} onTouchCancel={touchEnd}>
<InstallPrompt/>
{(pull.y>0||pull.refreshing)&&<div className="no-print" style={{position:'fixed',top:'calc(env(safe-area-inset-top) + 8px)',left:'50%',transform:`translate(-50%,${Math.min(70,pull.refreshing?56:pull.y)}px)`,zIndex:9999,background:W,border:`0.5px solid ${BD}`,borderRadius:999,padding:'8px 12px',display:'flex',alignItems:'center',gap:7,boxShadow:'0 10px 28px rgba(15,23,42,.16)',color:B,fontSize:12,fontWeight:800,pointerEvents:'none',transition:pull.refreshing?'transform .18s ease':'none'}}><i className="ti ti-refresh" style={{fontSize:16,animation:pull.refreshing?'pullspin .8s linear infinite':'none'}}/>{pull.refreshing?'Шинэчилж байна':'Доош татаж шинэчлэх'}</div>}
{toast&&<div style={{background:'#15803d',color:'#fff',padding:'11px 20px',textAlign:'center',fontSize:13,fontWeight:600}}>{toast}</div>}
{vt==='new'?<NewOrderScreen onSave={addOrder} back={back} products={products} custs={custs} user={user}/>:
 vt==='edit'?<NewOrderScreen onSave={addOrder} onUpdate={updateOrder} back={back} products={products} custs={custs} editOrder={view.o} user={user}/>:
 vt==='detail'?<OrderDetail order={view.o} custs={custs} back={back} onUpdateStatus={updStatus} onUpdatePayment={updPayment} onEdit={o=>setView({type:'edit',o})} onCopy={copyOrder}/>:
 vt==='products'?<ProductsScreen products={products} setProducts={setProducts} categories={categories} back={back}/>:
 vt==='customers'?<CustomersScreen custs={custs} setCusts={setCusts} back={back}/>:
 vt==='categories'?<CategoriesScreen categories={categories} setCategories={updateCategories} products={products} back={back}/>:
 vt==='users'?<UsersScreen users={users} setUsers={setUsers} currentUser={user} back={back}/>:
 vt==='profile'?<ProfileScreen user={user} onSave={saveProfile} back={back}/>:
 vt==='invoices'?<InvoicesScreen orders={visibleOrders} custs={custs} back={back}/>:
 vt==='company'?<CompanyScreen back={back}/>:
 vt==='tax'?<TaxScreen back={back}/>:
 vt==='security'?<SecurityScreen back={back}/>:
 vt==='backup'?<BackupScreen back={back}/>:
 (<>
  {tab==='home'&&<HomeScreen orders={orders} custs={custs} users={users} user={user} onDetail={o=>setView({type:'detail',o})} onViewAll={()=>setTab('orders')}/>}
  {tab==='reports'&&<ReportsScreen orders={orders} custs={custs} user={user}/>}
  {tab==='orders'&&<OrdersScreen orders={visibleOrders} custs={custs} onDetail={o=>setView({type:'detail',o})} onNew={()=>setView({type:'new'})}/>}
  {tab==='more'&&<MoreScreen orders={visibleOrders} products={products} custs={custs} users={users} categories={categories} user={user} onNav={k=>navFns[k]&&navFns[k]()} onLogout={()=>{getSupabaseClient()?.auth.signOut().catch?.(()=>{});setUser(null);setTab('home');setView(null)}}/>}
  <div className="no-print" style={{height:'calc(96px + env(safe-area-inset-bottom))'}}/>
  <Nav tab={tab} set={setTab} onNew={()=>setView({type:'new'})}/>
 </>)}
</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then((registration) => {
      registration.update();
    }).catch(() => {});
    navigator.serviceWorker.addEventListener("message", (event) => {
      if (event.data?.type === "APP_UPDATED") window.location.reload();
    });
  });
}
</script>
</body>
</html>
